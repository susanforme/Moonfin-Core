name: Android TV CN APK

# Required repository Actions secrets (use the SAME keystore for every update):
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD. ANDROID_KEYSTORE_TYPE is optional (JKS / PKCS12).
# Run this workflow from a *-cn branch. It never runs the repository test suites.
on:
  push:
    branches: ['*-cn']
    paths:
      - lib/l10n/app_zh.arb
      - .github/workflows/android-tv-cn.yml
      - .github/workflows/sync-upstream-cn.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: CN commit to build after upstream synchronization
        type: string
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: android-tv-cn-apk
  cancel-in-progress: false

jobs:
  build:
    if: github.repository != 'Moonfin-Client/Moonfin-Core'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.caching=true
      ANDROID_API_LEVEL: '36'
      ANDROID_BUILD_TOOLS_VERSION: '36.0.0'
      ANDROID_NDK_VERSION: '28.2.13676358'
      ANDROID_CMAKE_VERSION: '3.22.1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve build metadata
        id: metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import time
          from pathlib import Path

          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text()
          version = re.search(r'^\s+android_tv_version:\s*[\'"]?([0-9]+\.[0-9]+\.[0-9]+)', text, re.M)
          sdk = re.search(r'^  FLUTTER_VERSION:\s*[\'"]([^\'"]+)', Path('.github/workflows/build.yml').read_text(), re.M)
          if not version or not sdk:
              raise SystemExit('Cannot resolve upstream Android TV / Flutter version; update the CN workflow.')
          # Seconds since 2020 avoid independent workflow run counters colliding.
          # Reruns receive a newer versionCode. Builds are serialized above.
          number = int(time.time()) - 1577836800
          if not 1 <= number <= 2100000000:
              raise SystemExit('Android versionCode is outside its supported range.')
          name = version[1] + '-cn'
          text, count = re.subn(r'^(\s+android_tv_build_number:)\s*\d+\s*$', rf'\g<1> {number}', text, flags=re.M)
          if count != 1:
              raise SystemExit('Expected one android_tv_build_number in pubspec.yaml.')
          text, count = re.subn(r'^(\s+android_tv_version:)\s*\S+\s*$', rf'\g<1> {name}', text, flags=re.M)
          if count != 1:
              raise SystemExit('Expected one android_tv_version in pubspec.yaml.')
          # Build metadata changes exist only on the disposable CI runner.
          pubspec.write_text(text)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'flutter={sdk[1]}\nnumber={number}\n')
              out.write(f'apk=Moonfin_AndroidTV_{name}_{number}.apk\n')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Gradle dependencies and build cache
        uses: gradle/actions/setup-gradle@v4
        with:
          # CN branches also need to populate caches, even when not the default.
          cache-read-only: false

      - name: Prepare personal release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          required = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD',
                      'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing repository Actions secrets: ' + ', '.join(missing))
          encoded = ''.join(os.environ['ANDROID_KEYSTORE_BASE64'].split())
          Path('android/app/release.keystore').write_bytes(base64.b64decode(encoded, validate=True))

          def escape(value):
              # java.util.Properties reads ISO-8859-1 and backslash escapes.
              result = []
              for char in value:
                  if char in '\\ :=#!':
                      result.append('\\' + char)
                  elif char in '\n\r\t':
                      result.append({'\n': '\\n', '\r': '\\r', '\t': '\\t'}[char])
                  elif ord(char) > 126 or ord(char) < 32:
                      units = char.encode('utf-16-be')
                      result.extend('\\u' + units[i:i+2].hex() for i in range(0, len(units), 2))
                  else:
                      result.append(char)
              return ''.join(result)

          properties = {'storePassword': os.environ['ANDROID_KEYSTORE_PASSWORD'],
                        'keyAlias': os.environ['ANDROID_KEY_ALIAS'],
                        'keyPassword': os.environ['ANDROID_KEY_PASSWORD']}
          if os.environ.get('ANDROID_KEYSTORE_TYPE'):
              properties['storeType'] = os.environ['ANDROID_KEYSTORE_TYPE']
          Path('android/keystore.properties').write_text(
              ''.join(f'{key}={escape(value)}\n' for key, value in properties.items()), encoding='ascii')
          PY
          keytool_args=()
          if [[ -n "${ANDROID_KEYSTORE_TYPE}" ]]; then
            keytool_args=(-storetype "$ANDROID_KEYSTORE_TYPE")
          fi
          keytool -list -keystore android/app/release.keystore \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" \
            "${keytool_args[@]}" > /dev/null

      - uses: android-actions/setup-android@v3
        with:
          # The action defaults to "tools platform-tools"; tools was removed
          # from the SDK repository. Install only the supported package here.
          packages: platform-tools

      - name: Locate Android SDK
        id: android-sdk
        run: printf 'root=%s\n' "$ANDROID_HOME" >> "$GITHUB_OUTPUT"

      - name: Restore Android SDK and native toolchains
        id: android-tools-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.android-sdk.outputs.root }}/platforms/android-${{ env.ANDROID_API_LEVEL }}
            ${{ steps.android-sdk.outputs.root }}/build-tools/${{ env.ANDROID_BUILD_TOOLS_VERSION }}
            ${{ steps.android-sdk.outputs.root }}/ndk/${{ env.ANDROID_NDK_VERSION }}
            ${{ steps.android-sdk.outputs.root }}/cmake/${{ env.ANDROID_CMAKE_VERSION }}
          key: ${{ runner.os }}-${{ runner.arch }}-cn-android-tools-v1-${{ env.ANDROID_API_LEVEL }}-${{ env.ANDROID_BUILD_TOOLS_VERSION }}-${{ env.ANDROID_NDK_VERSION }}-${{ env.ANDROID_CMAKE_VERSION }}

      - name: Install upstream native build tools
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-$ANDROID_API_LEVEL" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION" \
            "ndk;$ANDROID_NDK_VERSION" "cmake;$ANDROID_CMAKE_VERSION"

      - name: Save installed Android toolchains
        if: steps.android-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.android-sdk.outputs.root }}/platforms/android-${{ env.ANDROID_API_LEVEL }}
            ${{ steps.android-sdk.outputs.root }}/build-tools/${{ env.ANDROID_BUILD_TOOLS_VERSION }}
            ${{ steps.android-sdk.outputs.root }}/ndk/${{ env.ANDROID_NDK_VERSION }}
            ${{ steps.android-sdk.outputs.root }}/cmake/${{ env.ANDROID_CMAKE_VERSION }}
          key: ${{ steps.android-tools-cache.outputs.cache-primary-key }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.metadata.outputs.flutter }}
          channel: stable
          cache: true

      - name: Validate Simplified Chinese resources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('lib/l10n')
          english = json.loads((root / 'app_en.arb').read_text())
          chinese = json.loads((root / 'app_zh.arb').read_text())
          if chinese.get('@@locale') != 'zh':
              raise SystemExit('Expected the upstream Simplified Chinese locale: zh.')
          keys = {key for key in english if not key.startswith('@')}
          if keys != {key for key in chinese if not key.startswith('@')}:
              raise SystemExit('CN message keys differ from the upstream template; synchronize translations first.')
          parameters = lambda value: set(re.findall(r'\{\s*([A-Za-z_]\w*)\s*[,}]', value))
          for key in keys:
              if not chinese[key] or parameters(chinese[key]) != parameters(english[key]):
                  raise SystemExit('Missing translation or parameter mismatch: ' + key)
          PY

      - name: Keep only Simplified Chinese and English for this build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('lib/l10n')
          keep = {'app_en.arb', 'app_zh.arb'}
          if not all((root / name).is_file() for name in keep):
              raise SystemExit('English and Simplified Chinese ARB files are required.')
          # Trim only the disposable CI checkout. All translations remain in Git.
          for path in root.glob('app_*.arb'):
              if path.name not in keep:
                  path.unlink()
          # Remove tracked output from previous all-language generation, then
          # regenerate the delegate and language classes from the two ARB files.
          for path in root.glob('app_localizations*.dart'):
              path.unlink()
          PY

      - name: Resolve locked dependencies and generate localizations
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter gen-l10n
          python3 - <<'PY'
          from pathlib import Path

          generated = {path.name for path in Path('lib/l10n').glob('app_localizations_*.dart')}
          if generated != {'app_localizations_en.dart', 'app_localizations_zh.dart'}:
              raise SystemExit(f'Unexpected generated language files: {sorted(generated)}')
          PY

      - name: Build Android TV release APK
        run: |
          set -euo pipefail
          flutter build apk --release --flavor androidTv \
            --dart-define=MOONFIN_FORCE_TV=true \
            --dart-define=DISTRIBUTION_CHANNEL=android_tv_apk

      - name: Verify signature and prepare APK
        env:
          APK_NAME: ${{ steps.metadata.outputs.apk }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-androidtv-release.apk
          apksigner="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/cn-apk-signature.txt"
          keytool -exportcert -keystore android/app/release.keystore \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" \
            -file "$RUNNER_TEMP/cn-signing-cert.der" > /dev/null
          expected=$(sha256sum "$RUNNER_TEMP/cn-signing-cert.der" | cut -d' ' -f1)
          grep -F "Signer #1 certificate SHA-256 digest: $expected" "$RUNNER_TEMP/cn-apk-signature.txt"
          mkdir -p dist
          cp "$apk" "dist/$APK_NAME"
          (cd dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: moonfin-android-tv-cn-${{ steps.metadata.outputs.number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f android/app/release.keystore android/keystore.properties

  publish:
    needs: build
    uses: ./.github/workflows/publish-cn-artifact.yml
    with:
      run_id: ${{ format('{0}', github.run_id) }}
    secrets: inherit
